services:
  devlegacy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sujalgawas/devlegacy/devlegacy:latest
    container_name: devlegacy
    ports: 
      - "8082:8082"
    networks:
      - tunnel_network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    command: tunnel --url http://devlegacy:8082
    networks:
      - tunnel_network
    restart: unless-stopped

networks:
  tunnel_network:
    driver: bridge